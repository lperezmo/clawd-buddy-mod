name: Idea
description: A new act, ride, readout or control
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should Clawd or the dashboard do, and when?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would it help you with?
    validations:
      required: false
